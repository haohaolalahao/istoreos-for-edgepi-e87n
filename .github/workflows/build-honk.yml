name: E87N iStoreOS + honk

# 在 GitHub Actions 上构建「能装 honk」的 iStoreOS 25.12 for EdgePi E87N
# 基于 micmtop/istoreos-for-edgepi-e87n 的构建流程，额外打开内核 BTF 并预置 honk 的 kmod。
#
# 用法（在 micmtop 仓库的 fork 里）：
#   1. 把本文件放到 .github/workflows/build-honk.yml
#   2. 把 honk.config.append 放到仓库根目录
#   3. Actions → I understand my workflows, go ahead and enable them → 选本 workflow → Run workflow
#   4. 跑完在 Artifacts 里下载 e87n-honk-firmware

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'iStoreOS 分支'
        type: string
        default: 'istoreos-25.12'
      jobs:
        description: '并行数（2 核 runner 建议 2）'
        type: string
        default: '2'

concurrency:
  group: e87n-honk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "=== after ==="; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget qemu-utils libelf-dev jq ccache
          sudo apt-get clean
          ccache --max-size 4G
          ccache --set-config=compression=true

      - name: Clone iStoreOS source
        run: |
          rm -rf istoreos
          git clone -b "${{ inputs.branch }}" --depth 1 https://github.com/istoreos/istoreos.git istoreos
          cd istoreos
          printf 'src-git nas https://github.com/linkease/nas-packages.git;linkeasefull\nsrc-git nas_luci https://github.com/linkease/nas-packages-luci.git;main\n' >> feeds.conf.default
          # LuCI 主题 Vantage（两个包：theme + dashboard app）
          printf 'src-git vantage https://github.com/anothaDev/luci-theme-vantage.git\n' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: istoreos/dl
          key: dl-${{ hashFiles('e87n.config', 'honk.config.append') }}
          restore-keys: |
            dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: istoreos/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: Apply E87N + MT7987 support
        run: bash apply.sh

      - name: Configure target (E87N + honk)
        run: |
          cd istoreos
          cp ../e87n.config .config
          # 关键：honk 的内核/BTF/kmod 配置必须在 defconfig 之前追加
          cat ../honk.config.append >> .config
          make defconfig

      - name: Gate - E87N device must be enabled
        run: |
          cd istoreos
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n=y' .config \
            || { echo "FATAL: edgepi_e87n device 没启用"; exit 1; }
          echo "E87N DEVICE ENABLED"

      - name: Gate - honk + vantage 依赖必须在 .config 里
        run: |
          cd istoreos
          miss=0
          for s in CONFIG_KERNEL_DEBUG_INFO_BTF=y \
                   CONFIG_PACKAGE_kmod-sched-bpf=y \
                   CONFIG_PACKAGE_kmod-nft-queue=y \
                   CONFIG_PACKAGE_kmod-nfnetlink-queue=y \
                   CONFIG_PACKAGE_kmod-veth=y \
                   CONFIG_PACKAGE_kmod-sched-core=y \
                   CONFIG_PACKAGE_kmod-nft-core=y \
                   CONFIG_PACKAGE_kmod-nf-conntrack=y \
                   CONFIG_PACKAGE_luci-theme-vantage=y \
                   CONFIG_PACKAGE_luci-app-vantage=y ; do
            if grep -qx -- "$s" .config; then echo "OK   $s"; else echo "MISS $s"; miss=1; fi
          done
          grep -q '^# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' .config \
            && echo "OK   DEBUG_INFO_REDUCED is not set" \
            || { echo "WARN: DEBUG_INFO_REDUCED 不是未设置，BTF 可能被丢弃"; }
          [ "$miss" = "0" ] || { echo "FATAL: honk 依赖被 defconfig 丢掉"; exit 1; }

      - name: Prepare kernel
        run: |
          set -o pipefail
          cd istoreos
          make target/linux/prepare V=s 2>&1 | tee /tmp/kernel-prepare.log
          if grep -qE "Patch .* does not apply|Failed to apply|Hunk #.* FAILED" /tmp/kernel-prepare.log; then
            echo "FATAL: 内核补丁应用失败"; exit 1
          fi

      - name: Build firmware
        run: |
          set -o pipefail
          cd istoreos
          df -h / || true
          make CCACHE=y -j"${{ inputs.jobs }}" V=s 2>&1 | tee /tmp/build.log
          df -h / || true

      - name: Verify firmware + kernel BTF
        run: |
          cd istoreos
          IMG=$(ls bin/targets/mediatek/filogic/*edgepi_e87n*sysupgrade*.bin 2>/dev/null | head -1)
          [ -n "$IMG" ] || { echo "FATAL: 没产出 E87N sysupgrade 镜像"; ls -la bin/targets/mediatek/filogic/ 2>/dev/null; exit 1; }
          ls -lh "$IMG"
          sha256sum "$IMG" | tee /tmp/SHA256SUMS

          KCFG=$(ls build_dir/target-*/linux-mediatek_filogic/linux-[0-9]*/.config 2>/dev/null | head -1)
          [ -n "$KCFG" ] || { echo "FATAL: 找不到内核 .config"; exit 1; }
          echo "=== 内核 BTF 校验 ==="
          grep -E '^CONFIG_DEBUG_INFO_BTF=' "$KCFG" || true
          grep -E '^CONFIG_DEBUG_INFO=' "$KCFG" || true
          grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$KCFG" \
            || { echo "FATAL: 内核 .config 没有 CONFIG_DEBUG_INFO_BTF=y"; exit 1; }
          echo "BTF OK"

      - name: Collect kmod .apk (same kernel hash as the firmware)
        if: always()
        run: |
          cd istoreos
          mkdir -p /tmp/kmods
          find bin -name 'kmod-*.apk' -exec cp -n {} /tmp/kmods/ \; 2>/dev/null || true
          find bin -name 'kernel-6.12.*.apk' -exec cp -n {} /tmp/kmods/ \; 2>/dev/null || true
          echo "collected $(ls /tmp/kmods 2>/dev/null | wc -l) apk"
          ls /tmp/kmods | grep -E 'sched-bpf|nft-queue|nfnetlink-queue' || echo "WARN: honk 的 kmod 没找到"

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e87n-honk-firmware
          path: |
            istoreos/bin/targets/mediatek/filogic/*edgepi_e87n*sysupgrade*.bin
            /tmp/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30

      - name: Upload kmods bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e87n-honk-kmods
          path: /tmp/kmods
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /tmp/build.log
            /tmp/kernel-prepare.log
          if-no-files-found: warn
          retention-days: 7
